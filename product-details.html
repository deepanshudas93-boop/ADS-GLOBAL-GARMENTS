<!DOCTYPE html>
<html lang="en">

<head>

  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>
    Product Details | ADS Global Garments
  </title>

  <style>

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    :root {
      --black: #080808;
      --dark: #101010;
      --dark-2: #151515;
      --yellow: #f7b719;
      --white: #f5f5f0;
      --gray: #999;
      --border: rgba(255,255,255,0.12);
    }

    body {
      min-height: 100vh;
      background: var(--black);
      color: var(--white);
      font-family: Arial, sans-serif;
    }

    .container {
      max-width: 1100px;
      margin: auto;
      padding: 40px 25px;
    }

    .product-card {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 40px;
      padding: 30px;
      background: var(--dark-2);
      border: 1px solid var(--border);
      border-radius: 12px;
    }

    .media-column {
      display: grid;
      gap: 15px;
    }

    .product-image {
      width: 100%;
      max-height: 550px;
      object-fit: cover;
      border-radius: 10px;
      border: 1px solid var(--border);
      background: #080808;
    }

    .product-video {
      width: 100%;
      max-height: 400px;
      border-radius: 10px;
      border: 1px solid var(--border);
      background: #000;
    }

    .no-image {
      min-height: 400px;
      display: grid;
      place-items: center;
      background: #101010;
      color: #777;
      border-radius: 10px;
      border: 1px dashed var(--border);
    }

    .product-details h1 {
      margin-bottom: 15px;
      font-size: 32px;
      line-height: 1.2;
    }

    .category {
      display: inline-block;
      margin-bottom: 25px;
      padding: 7px 12px;
      background: rgba(247,183,25,0.12);
      color: var(--yellow);
      border-radius: 20px;
      font-size: 13px;
    }

    .details-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 15px;
      margin-bottom: 25px;
    }

    .detail-box {
      padding: 16px;
      background: #101010;
      border: 1px solid var(--border);
      border-radius: 8px;
    }

    .detail-box span {
      display: block;
      margin-bottom: 7px;
      color: var(--gray);
      font-size: 12px;
    }

    .detail-box strong {
      color: var(--white);
      font-size: 15px;
      line-height: 1.5;
      word-break: break-word;
    }

    .description-title {
      margin-bottom: 10px;
      font-size: 18px;
    }

    .description {
      color: #bbb;
      line-height: 1.7;
      font-size: 14px;
      white-space: pre-wrap;
      word-break: break-word;
    }

    .loading,
    .error {
      padding: 60px;
      text-align: center;
      color: var(--gray);
    }

    .error {
      color: #ff7777;
    }

    @media (max-width: 750px) {

      .product-card {
        grid-template-columns: 1fr;
        padding: 20px;
        gap: 25px;
      }

      .product-details h1 {
        font-size: 26px;
      }

    }

    @media (max-width: 450px) {

      .container {
        padding: 25px 15px;
      }

      .details-grid {
        grid-template-columns: 1fr;
      }

      .loading,
      .error {
        padding: 40px 20px;
      }

    }

  </style>

</head>

<body>

  <main class="container">

    <div
      id="productContainer"
      class="loading"
    >
      Loading product...
    </div>

  </main>


  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>


  <script>

    const SUPABASE_URL =
      "https://vmqobgowygkofnsigaqz.supabase.co";


    const SUPABASE_PUBLISHABLE_KEY =
      "sb_publishable_R4SJlEqJATYIisBLbD4lSg_5a6b9thT";


    const supabaseClient =
      window.supabase.createClient(
        SUPABASE_URL,
        SUPABASE_PUBLISHABLE_KEY
      );


    const productContainer =
      document.getElementById(
        "productContainer"
      );


    const urlParams =
      new URLSearchParams(
        window.location.search
      );


    const productId =
      urlParams.get("id");


    // ===============================
    // SECURITY
    // ===============================

    function escapeHTML(
      value
    ) {

      return String(
        value ?? ""
      )

        .replace(
          /&/g,
          "&amp;"
        )

        .replace(
          /</g,
          "&lt;"
        )

        .replace(
          />/g,
          "&gt;"
        )

        .replace(
          /"/g,
          "&quot;"
        )

        .replace(
          /'/g,
          "&#039;"
        );

    }


    // ===============================
    // LOAD PRODUCT
    // ===============================

    async function loadProduct() {

      if (!productId) {

        productContainer.className =
          "error";


        productContainer.textContent =
          "Product ID not found.";


        return;

      }


      const {
        data: product,
        error
      } =
        await supabaseClient

          .from("products")

          .select("*")

          .eq(
            "id",
            productId
          )

          .single();


      if (error) {

        productContainer.className =
          "error";


        productContainer.textContent =
          "Could not load product: " +
          error.message;


        return;

      }


      if (!product) {

        productContainer.className =
          "error";


        productContainer.textContent =
          "Product not found.";


        return;

      }


      renderProduct(
        product
      );

    }


    // ===============================
    // RENDER PRODUCT
    // ===============================

    function renderProduct(
      product
    ) {

      productContainer.className =
        "product-card";


      productContainer.innerHTML = `

        <div class="media-column">

          ${
            product.image_url

              ?

            `

              <img
                class="product-image"
                src="${escapeHTML(
                  product.image_url
                )}"
                alt="${escapeHTML(
                  product.name
                )}"
              >

            `

              :

            `

              <div class="no-image">
                No Product Image
              </div>

            `

          }

          ${
            product.video_url

              ?

            `

              <video
                class="product-video"
                src="${escapeHTML(
                  product.video_url
                )}"
                controls
                playsinline
              ></video>

            `

              :

            ``

          }

        </div>


        <div class="product-details">

          <h1>
            ${escapeHTML(
              product.name
            )}
          </h1>


          <span class="category">

            ${escapeHTML(
              product.category ||
              "Garment Product"
            )}

          </span>


          <div class="details-grid">


            <div class="detail-box">

              <span>
                FABRIC
              </span>

              <strong>

                ${escapeHTML(
                  product.fabric ||
                  "Not specified"
                )}

              </strong>

            </div>


            <div class="detail-box">

              <span>
                GSM
              </span>

              <strong>

                ${escapeHTML(
                  product.gsm ||
                  "Not specified"
                )}

              </strong>

            </div>


            <div class="detail-box">

              <span>
                MOQ
              </span>

              <strong>

                ${escapeHTML(
                  product.moq ||
                  "Not specified"
                )}

              </strong>

            </div>


            <div class="detail-box">

              <span>
                SIZES
              </span>

              <strong>

                ${escapeHTML(
                  product.sizes ||
                  "Not specified"
                )}

              </strong>

            </div>


            <div class="detail-box">

              <span>
                COLOURS
              </span>

              <strong>

                ${escapeHTML(
                  product.colors ||
                  "Not specified"
                )}

              </strong>

            </div>


          </div>


          <h2 class="description-title">

            Product Description

          </h2>


          <p class="description">

            ${escapeHTML(
              product.description ||
              "No description available."
            )}

          </p>


        </div>

      `;

    }


    // ===============================
    // START
    // ===============================

    loadProduct();

  </script>

</body>

</html>
